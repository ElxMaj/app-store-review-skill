name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Run scanner tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check JSON output
        run: python3 scripts/app_store_review_scan.py . --format json | python3 -m json.tool >/dev/null
      - name: Validate package and evaluation JSON
        run: |
          python3 -m json.tool tessl.json >/dev/null
          python3 -m json.tool .tessl-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool copilot-plugin/.github/plugin/plugin.json >/dev/null
          find evals -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: Validate maintenance scripts and workflows
        run: |
          bash -n scripts/check_registry_health.sh
          python3 -m py_compile .github/scripts/check_action_pins.py
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.parse_file(path) }'
      - name: Check portable archive
        run: unzip -t app-store-review-skill.skill
